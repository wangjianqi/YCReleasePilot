name: YCReleasePilot
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
packages:
  LLMStream:
    url: https://github.com/synth-inc/LLMStream
    branch: main
  SwiftyChat:
    url: https://github.com/EnesKaraosman/SwiftyChat.git
    from: 4.1.1
targets:
  ReleasePilot:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ReleasePilot
      - path: assets
        type: folder
      - path: Resources/Assets.xcassets
    dependencies:
      - package: LLMStream
      - package: SwiftyChat
    settings:
      base:
        PRODUCT_NAME: ReleasePilot
        PRODUCT_BUNDLE_IDENTIFIER: ai.opensource.ReleasePilot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleName: ReleasePilot
        INFOPLIST_KEY_CFBundleDisplayName: ReleasePilot
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets: []
